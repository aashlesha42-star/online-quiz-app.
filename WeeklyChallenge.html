<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizMaster - Weekly Challenges</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .weekly-container {
            max-width: 650px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            color: #321052;
            border-radius: 20px;
            text-align: center;
        }

        .challenge-card {
            background: #f3e8ff;
            padding: 20px;
            margin: 18px 0;
            border-radius: 15px;
        }

        .challenge-card h3 {
            margin-bottom: 10px;
        }

        .challenge-card button {
            background: #6a0dad;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .challenge-card button:hover {
            background: #481080;
        }

        .back-btn {
            margin-top: 20px;
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            background: #321052;
            color: white;
            cursor: pointer;
        }

        #challengeMessage {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body data-theme="purple">

    <div class="weekly-container">

        <h1>🏆 Weekly Challenges</h1>

        <p>Complete challenges and earn bonus coins!</p>

        <h2>⭐ Your Weekly Progress</h2>

        <p id="completedCount">Completed: 0 / 3</p>

        <div class="challenge-card">
            <h3>🧠 Challenge 1</h3>
            <p>Answer 10 quiz questions.</p>
            <p>Reward: 20 Coins</p>
            <button onclick="completeChallenge(1)">
                Complete Challenge
            </button>
        </div>

        <div class="challenge-card">
            <h3>🔥 Challenge 2</h3>
            <p>Score at least 5 correct answers.</p>
            <p>Reward: 30 Coins</p>
            <button onclick="completeChallenge(2)">
                Complete Challenge
            </button>
        </div>

        <div class="challenge-card">
            <h3>👑 Challenge 3</h3>
            <p>Play 3 quizzes.</p>
            <p>Reward: 50 Coins</p>
            <button onclick="completeChallenge(3)">
                Complete Challenge
            </button>
        </div>

        <p id="challengeMessage"></p>

        <button class="back-btn"
            onclick="location.href='index.html'">
            ⬅ Back to Home
        </button>

    </div>

    <script>
        const savedTheme =
            localStorage.getItem("selectedTheme") || "purple";

        document.body.setAttribute("data-theme", savedTheme);

        let completedChallenges =
            JSON.parse(localStorage.getItem("weeklyChallenges")) || [];

        function updateProgress() {
            document.getElementById("completedCount").innerText =
                "Completed: " + completedChallenges.length + " / 3";

            document.querySelectorAll(".challenge-card button")
                .forEach((button, index) => {
                    if (completedChallenges.includes(index + 1)) {
                        button.innerText = "✅ Completed";
                        button.disabled = true;
                    }
                });
        }

        function completeChallenge(id) {

            if (completedChallenges.includes(id)) {
                return;
            }

            let rewards = {
                1: 20,
                2: 30,
                3: 50
            };

            let coins =
                Number(localStorage.getItem("dailyBonus")) || 0;

            coins += rewards[id];

            localStorage.setItem("dailyBonus", coins);

            completedChallenges.push(id);

            localStorage.setItem(
                "weeklyChallenges",
                JSON.stringify(completedChallenges)
            );

            document.getElementById("challengeMessage").innerText =
                "🎉 Challenge completed! You earned " +
                rewards[id] + " coins!";

            updateProgress();
        }

        updateProgress();
    </script>

</body>
</html>
