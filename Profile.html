<!DOCTYPE html>
<html>
<head>
    <title>QuizMaster - Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>👤 Player Profile</h1>

    <h2 id="playerName">Player</h2>

    <h3>Total Quizzes Played: <span id="total">0</span></h3>

    <h3>Highest Score: <span id="highest">0</span></h3>

    <h3>Average Score: <span id="average">0</span></h3>

    <button onclick="location.href='index.html'">Home</button>

    <script>
        let leaderboard =
            JSON.parse(localStorage.getItem("leaderboard")) || [];

        let name = localStorage.getItem("playerName") || "Player";

        document.getElementById("playerName").textContent = name;

        document.getElementById("total").textContent =
            leaderboard.length;

        if (leaderboard.length > 0) {
            let scores = leaderboard.map(player => player.score);

            let highest = Math.max(...scores);

            let average =
                scores.reduce((a, b) => a + b, 0) / scores.length;

            document.getElementById("highest").textContent = highest;

            document.getElementById("average").textContent =
                average.toFixed(1);
        }
    </script>

</body>
</html>
