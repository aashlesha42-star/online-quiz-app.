<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizMaster - Daily Challenge</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    background: linear-gradient(135deg, #18052e, #481080, #7b2cbf);
}

.container {
    max-width: 550px;
    margin: 35px auto;
    padding: 25px;
    background: #ffffff18;
    border: 1px solid #ffffff40;
    border-radius: 22px;
}

h1 {
    color: #ffd166;
}

.info {
    color: #eee0ff;
    line-height: 1.6;
}

button {
    padding: 13px 22px;
    margin: 10px;
    border: none;
    border-radius: 12px;
    background: #ffd166;
    color: #32104f;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.answer {
    display: block;
    width: 100%;
    margin: 12px 0;
    background: white;
    color: #481080;
}

.answer:disabled {
    opacity: 1;
}

#questionArea, #result {
    display: none;
}

#feedback {
    min-height: 60px;
    max-width: 600px;
    margin: 20px auto;
    padding: 12px;
    font-size: 16px;
    line-height: 1.6;
    font-weight: bold;
    border-radius: 12px;
    overflow-wrap: break-word;

    .progress-container {
    width: 100%;
    height: 12px;
    background: #ddd;
    border-radius: 20px;
    margin: 15px 0 25px;
    overflow: hidden;
}

#dailyProgress {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #20c997, #00b894);
    border-radius: 20px;
    transition: width 0.4s ease;
}
}

    .difficulty-options {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px 0;
}

.difficulty-btn {
    padding: 14px 22px;
    border: 2px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.difficulty-btn.selected {
    border: 3px solid #20c997;
    transform: scale(1.05);
}

.difficulty-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
</style>
</head>

<body data-theme="purple">

<div class="container">

<h1>🌟 Daily Challenge</h1>

<p class="info">
Complete today's five questions and earn bonus points!
</p>

<h3>🔥 Daily Streak: <span id="streak">0</span> days</h3>

<h3>🏆 Bonus Points: <span id="bonus">0</span></h3>

<div id="startArea">

    <h2>🎯 Choose Your Difficulty</h2>

    <p>Select a level and test your brain!</p>

    <div class="difficulty-options">

        <button class="difficulty-btn selected"
            onclick="selectDifficulty('easy', this)">
            🌱 EASY
        </button>

        <button class="difficulty-btn"
            id="mediumLevel"
            onclick="selectDifficulty('medium', this)">
            ⭐ MEDIUM 🔒
        </button>

        <button class="difficulty-btn"
            id="hardLevel"
            onclick="selectDifficulty('hard', this)">
            🔥 HARD 🔒
        </button>

    </div>

    <button onclick="startChallenge()">
        🚀 Start Challenge
    </button>

</div>

<div id="questionArea">
    <h3 id="questionNumber"></h3>

<div class="progress-container">
    <div id="dailyProgress"></div>
</div>
    <h2 id="question"></h2>
    <div id="answers"></div>
    <p id="feedback"></p>
</div>

<div id="result">
    <h2>🎉 Challenge Completed!</h2>
    <h2 id="finalScore"></h2>
    <h3 id="badge"></h3>
</div>

<button onclick="location.href='index.html'">🏠 Home</button>

</div>

<script>

// DAILY CHALLENGE QUESTION BANK

const questionBank = [

    {
        q: "Which animal has THREE hearts?",
        a: ["Shark", "Octopus", "Penguin", "Dolphin"],
        c: "Octopus"
    },
    {
        q: "Which planet has a day longer than its year?",
        a: ["Mars", "Jupiter", "Venus", "Mercury"],
        c: "Venus"
    },
    {
        q: "Which animal tastes using its feet?",
        a: ["Butterfly", "Elephant", "Rabbit", "Tiger"],
        c: "Butterfly"
    },
    {
        q: "What is the collective name for a group of flamingos?",
        a: ["A parade", "A flamboyance", "A galaxy", "A crowd"],
        c: "A flamboyance"
    },
    {
        q: "What do camels actually store in their humps?",
        a: ["Water", "Air", "Fat", "Food"],
        c: "Fat"
    },
    {
        q: "Which part of an owl cannot move like human eyes?",
        a: ["Eyelids", "Eyeballs", "Pupils", "Ears"],
        c: "Eyeballs"
    },
    {
        q: "Which fruit is botanically classified as a berry?",
        a: ["Strawberry", "Banana", "Apple", "Pear"],
        c: "Banana"
    },
    {
        q: "Which is hotter: a lightning bolt or the surface of the Sun?",
        a: ["Sun's surface", "Lightning bolt", "Both are equal", "Neither"],
        c: "Lightning bolt"
    },
    {
        q: "What makes popcorn pop?",
        a: ["Sugar inside it", "Water turning into steam", "Sunlight", "Air bubbles"],
        c: "Water turning into steam"
    },
    {
        q: "What gives flamingos their pink colour?",
        a: ["Their genes alone", "Sunlight", "Pigments in their food", "Pink feathers at birth"],
        c: "Pigments in their food"
    },
    {
        q: "What happens to water when it freezes?",
        a: ["It expands", "It disappears", "It becomes lighter in colour", "It shrinks"],
        c: "It expands"
    },
    {
        q: "Which animal has fingerprints surprisingly similar to humans?",
        a: ["Koala", "Giraffe", "Panda", "Kangaroo"],
        c: "Koala"
    },
    {
        q: "What is the smallest prime number?",
        a: ["1", "2", "3", "0"],
        c: "2"
    },
    {
        q: "You overtake the person in second place in a race. What position are you now?",
        a: ["First", "Second", "Third", "Last"],
        c: "Second"
    },
    {
        q: "Find the missing number: 2, 6, 12, 20, 30, __",
        a: ["36", "40", "42", "44"],
        c: "42"
    },
    {
        q: "Which ocean is the largest on Earth?",
        a: ["Atlantic", "Indian", "Arctic", "Pacific"],
        c: "Pacific"
    },
    {
        q: "Which gas do plants absorb during photosynthesis?",
        a: ["Oxygen", "Carbon dioxide", "Nitrogen", "Hydrogen"],
        c: "Carbon dioxide"
    },
    {
        q: "What is the name of the fear of spiders?",
        a: ["Acrophobia", "Arachnophobia", "Claustrophobia", "Hydrophobia"],
        c: "Arachnophobia"
    },
    {
        q: "Which instrument has keys but cannot open a door?",
        a: ["Piano", "Compass", "Telescope", "Thermometer"],
        c: "Piano"
    },
    {
        q: "How many months have at least 28 days?",
        a: ["1", "2", "11", "12"],
        c: "12"
    }
];


// SELECT 5 DIFFERENT QUESTIONS FOR EACH DAY

function getDailyQuestions() {

    const dateKey = new Date().toLocaleDateString("en-CA");

    let seed = [...dateKey].reduce(
        (total, character) => total + character.charCodeAt(0),
        0
    );

    function random() {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
    }

    const shuffled = [...questionBank];

    for (let i = shuffled.length - 1; i > 0; i--) {

        const j = Math.floor(random() * (i + 1));

        [shuffled[i], shuffled[j]] =
            [shuffled[j], shuffled[i]];
    }

    return shuffled.slice(0, 5);
}

const questions = getDailyQuestions();

// DIFFICULTY SYSTEM

let selectedDifficulty = "easy";

let completedChallenges =
    Number(localStorage.getItem("completedDailyChallenges")) || 0;

function updateDifficultyLocks() {

    const mediumButton = document.getElementById("mediumLevel");
    const hardButton = document.getElementById("hardLevel");

    mediumButton.disabled = completedChallenges < 3;
    hardButton.disabled = completedChallenges < 7;

    mediumButton.textContent =
        completedChallenges >= 3 ? "⭐ MEDIUM" : "⭐ MEDIUM 🔒";

    hardButton.textContent =
        completedChallenges >= 7 ? "🔥 HARD" : "🔥 HARD 🔒";
}

function selectDifficulty(level, button) {

    if (button.disabled) return;

    selectedDifficulty = level;

    document.querySelectorAll(".difficulty-btn").forEach(btn => {
        btn.classList.remove("selected");
    });

    button.classList.add("selected");
}

updateDifficultyLocks();
    // FUN FACT EXPLANATIONS

const funFacts = {
    "Which animal has THREE hearts?":
        "An octopus has three hearts! Two pump blood to the gills, and one pumps it to the rest of the body.",

    "Which planet has a day longer than its year?":
        "Venus rotates so slowly that one rotation takes longer than its trip around the Sun!",

    "Which animal tastes using its feet?":
        "Butterflies have taste sensors on their feet. They can taste a plant simply by landing on it!",

    "What is the collective name for a group of flamingos?":
        "A group of flamingos is called a flamboyance. What a fabulous name!",

    "What do camels actually store in their humps?":
        "Camel humps store fat, not water. The fat provides energy when food is scarce!",

    "Which part of an owl cannot move like human eyes?":
        "Owl eyeballs are tube-shaped and fixed in place. That's why owls turn their heads to look around!",

    "Which fruit is botanically classified as a berry?":
        "Surprise! Bananas are botanical berries, but strawberries are not true berries!",

    "Which is hotter: a lightning bolt or the surface of the Sun?":
        "A lightning bolt can reach around 30,000 Kelvin, much hotter than the Sun's visible surface!",

    "What makes popcorn pop?":
        "Water inside the popcorn kernel turns into steam. Pressure builds until the kernel bursts!",

    "What gives flamingos their pink colour?":
        "Flamingos get their pink colour from natural pigments called carotenoids in their food!",

    "What happens to water when it freezes?":
        "Water expands when it freezes. That's why ice floats on liquid water!",

    "Which animal has fingerprints surprisingly similar to humans?":
        "Koalas have fingerprints that look remarkably similar to human fingerprints!",

    "What is the smallest prime number?":
        "Two is the only even prime number. Every other even number can be divided by two!",

    "You overtake the person in second place in a race. What position are you now?":
        "You take their position! Tricky questions make you think twice!",

    "Find the missing number: 2, 6, 12, 20, 30, __":
        "The differences are 4, 6, 8, 10 and then 12. So the next number is 42!",

    "Which ocean is the largest on Earth?":
        "The Pacific Ocean is the largest ocean on Earth. It covers more area than all the continents combined!",

    "Which gas do plants absorb during photosynthesis?":
        "Plants absorb carbon dioxide and use light energy to help make their food!",

    "What is the name of the fear of spiders?":
        "Arachnophobia is the term for an intense fear of spiders!",

    "Which instrument has keys but cannot open a door?":
        "A piano can have 88 keys, but not a single one opens a door!",

    "How many months have at least 28 days?":
        "All 12 months have at least 28 days. A classic trick question!"
};

let current = 0;
let score = 0;
let answered = false;

const today = new Date().toLocaleDateString("en-CA");

let streak = Number(localStorage.getItem("dailyStreak")) || 0;
let lastDate = localStorage.getItem("lastChallengeDate");

document.getElementById("streak").textContent = streak;
document.getElementById("bonus").textContent =
    Number(localStorage.getItem("dailyBonus")) || 0;

if (lastDate === today) {
    document.getElementById("startArea").innerHTML =
        "<h3>✅ Today's challenge is already completed!</h3>";
}

function startChallenge() {

    if (lastDate === today) {
        return;
    }

    document.getElementById("startArea").style.display = "none";
    document.getElementById("questionArea").style.display = "block";

    showQuestion();
}

function showQuestion() {

    answered = false;

    document.getElementById("questionNumber").textContent =
        "Question " + (current + 1) + " of " + questions.length;

    // UPDATE DAILY PROGRESS BAR
    const progress = (current / questions.length) * 100;

    document.getElementById("dailyProgress").style.width =
        progress + "%";

    document.getElementById("question").textContent =
        questions[current].q;

    document.getElementById("feedback").textContent = "";

    const answers = document.getElementById("answers");
    answers.innerHTML = "";

    questions[current].a.forEach(option => {

        const button = document.createElement("button");

        button.textContent = option;
        button.className = "answer";

        button.onclick = () => checkAnswer(button, option);

        answers.appendChild(button);

    });
}
function checkAnswer(button, selected) {

    if (answered) return;

    answered = true;

    const correct = questions[current].c;

   const explanation = funFacts[questions[current].q] || "";

if (selected === correct) {
    score++;
    button.style.background = "#20c997";
    document.getElementById("feedback").textContent =
        "✅ Correct! " + explanation;
} else {
    button.style.background = "#ff6b6b";
    document.getElementById("feedback").textContent =
        "❌ Correct answer: " + correct + ". " + explanation;
}

    document.querySelectorAll(".answer").forEach(btn => {
        btn.disabled = true;

        if (btn.textContent === correct) {
            btn.style.background = "#20c997";
        }
    });

    const next = document.createElement("button");

    next.textContent = current === questions.length - 1
        ? "Finish Challenge"
        : "Next Question";

    next.onclick = nextQuestion;

    document.getElementById("answers").appendChild(next);
}

function nextQuestion() {

    current++;

    if (current < questions.length) {
        showQuestion();
    } else {
        finishChallenge();
    }
}

function finishChallenge() {

    // COMPLETE PROGRESS BAR
    document.getElementById("dailyProgress").style.width = "100%";

    document.getElementById("questionArea").style.display = "none";
    document.getElementById("result").style.display = "block";

    let yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);

    const yesterdayString = yesterday.toLocaleDateString("en-CA");

    if (lastDate === yesterdayString) {
        streak++;
    } else {
        streak = 1;
    }

    let bonus = score * 10;

    localStorage.setItem("dailyStreak", streak);
    localStorage.setItem("dailyBonus",
        (Number(localStorage.getItem("dailyBonus")) || 0) + bonus);

    localStorage.setItem("lastChallengeDate", today);

    document.getElementById("finalScore").textContent =
        "Your Score: " + score + "/5";

    document.getElementById("streak").textContent = streak;

    document.getElementById("bonus").textContent =
        Number(localStorage.getItem("dailyBonus"));

    let badge = "🌱 Beginner";

    if (score === 5) {
        badge = "🏆 Perfect Score Champion!";
    } else if (score >= 3) {
        badge = "⭐ Smart Player!";
    }

    document.getElementById("badge").textContent = badge;
}
<script>
const savedTheme = localStorage.getItem("selectedTheme") || "purple";
document.body.setAttribute("data-theme", savedTheme);
</script>
</body>
</html>
