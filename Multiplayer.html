<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster - Multiplayer</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .multiplayer-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 25px;
            text-align: center;
            background: white;
            color: #32105c;
            border-radius: 20px;
        }

        .multiplayer-container input {
            width: 90%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        .multiplayer-container button {
            padding: 12px 22px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            background: #7027b8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #roomCode {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body data-theme="purple">

    <div class="multiplayer-container">
        <h1>🎮 Multiplayer Quiz</h1>
        <p>Play quizzes together with your friends!</p>

        <input
            type="text"
            id="playerName"
            placeholder="Enter your name"
            maxlength="20"
        >

        <br>

        <button onclick="createRoom()">Create Room</button>

        <hr>

        <h3>Join a Room</h3>

        <input
            type="text"
            id="joinCode"
            placeholder="Enter 6-digit room code"
            maxlength="6"
        >

        <br>

        <button onclick="joinRoom()">Join Room</button>

        <div id="roomSection" style="display:none;">
            <h3>Your Room Code</h3>
            <p id="roomCode"></p>

            <h3>Players</h3>
            <ul id="playerList"></ul>

            <button id="startButton" style="display:none;">
                Start Quiz
            </button>
        </div>

        <p id="message"></p>
    </div>

    <script>
        const savedTheme =
            localStorage.getItem("selectedTheme") || "purple";

        document.body.setAttribute("data-theme", savedTheme);
    </script>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="Multiplayer.js"></script>

</body>
</html>
