
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizMaster - Multiplayer</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        .multiplayer-container {
            max-width: 500px;
            margin: 40px auto;
            padding: 25px;
            text-align: center;
            background: white;
            color: #32104f;
            border-radius: 20px;
        }

        .multiplayer-container input {
            width: 90%;
            padding: 13px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .multiplayer-container button {
            padding: 12px 22px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            background: #7027b8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .multiplayer-container button:hover {
            background: #481080;
        }

        .room-code {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 6px;
            color: #7027b8;
        }

        #roomSection {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background: #f3e8ff;
            border-radius: 15px;
        }

        #playerList {
            list-style: none;
            padding: 0;
        }

        #playerList li {
            background: white;
            padding: 10px;
            margin: 8px;
            border-radius: 8px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .back-button {
            background: #555 !important;
        }

        @media(max-width: 500px) {
            .multiplayer-container {
                margin: 20px 12px;
            }
        }
    </style>

</head>

<body data-theme="purple">

    <div class="multiplayer-container">

        <h1>🎮 Multiplayer Quiz</h1>

        <p>Play and compete with your friends!</p>

        <hr>

        <h3>Enter Your Name</h3>

        <input
            type="text"
            id="playerName"
            placeholder="Enter your name"
            maxlength="20"
        >

        <br>

        <button onclick="createRoom()">
            ➕ Create Room
        </button>

        <hr>

        <h3>Join a Room</h3>

        <input
            type="text"
            id="joinCode"
            placeholder="Enter 6-digit room code"
            maxlength="6"
            inputmode="numeric"
        >

        <br>

        <button onclick="joinRoom()">
            🚀 Join Room
        </button>


        <!-- ROOM SECTION -->

        <div id="roomSection">

            <h2>Room Created! 🎉</h2>

            <p>Share this code with your friends:</p>

            <p id="roomCode" class="room-code"></p>

            <h3>👥 Players in Room</h3>

            <ul id="playerList"></ul>

            <button id="startButton" style="display:none;">
                ▶ Start Quiz
            </button>

        </div>


        <p id="message"></p>

        <br>

        <button
            class="back-button"
            onclick="window.location.href='index.html'">

            ⬅ Back to Home

        </button>

    </div>


    <!-- FIREBASE -->

    <script type="module" src="firebase.js"></script>

    <!-- MULTIPLAYER JAVASCRIPT -->

    <script type="module" src="Multiplayer.js"></script>


    <!-- THEME -->

    <script>
        const savedTheme =
            localStorage.getItem("selectedTheme") || "purple";

        document.body.setAttribute("data-theme", savedTheme);
    </script>

</body>

</html>
