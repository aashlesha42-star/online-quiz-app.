<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuizMaster - Challenge Your Brain</title>
<link rel="stylesheet" href="style.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #18052e, #481080, #7b2cbf);
    color: white;
    min-height: 100vh;
    text-align: center;
    padding: 25px 15px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    text-align: left;
    max-width: 900px;
    margin: auto;
}

.logo span {
    color: #ffd166;
}

.hero {
    margin: 75px auto 45px;
    max-width: 700px;
}

.badge {
    display: inline-block;
    background: #ffffff20;
    padding: 10px 20px;
    border-radius: 30px;
    margin-bottom: 25px;
    font-size: 14px;
}

h1 {
    font-size: clamp(38px, 8vw, 65px);
    margin-bottom: 18px;
}

h1 span {
    color: #ffd166;
}

.subtitle {
    color: #eee0ff;
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 30px;
}

.start-btn {
    background: #ffd166;
    color: #32104f;
    border: none;
    padding: 17px 45px;
    border-radius: 35px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.start-btn:hover {
    transform: scale(1.08);
    background: white;
}

.login-reward {
    max-width: 420px;
    margin: 30px auto;
    padding: 25px;
    background: #ffffff20;
    border: 1px solid #ffffff45;
    border-radius: 20px;
}

.login-reward h2 {
    color: #ffd166;
    margin-bottom: 12px;
}

.login-reward p {
    margin: 10px 0;
    line-height: 1.5;
}

.reward-button {
    background: #ffd166;
    color: #32104f;
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    font-weight: bold;
    margin-top: 12px;
}

.features {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 18px;
    max-width: 900px;
    margin: 55px auto 35px;
}

.card {
    background: #ffffff18;
    border: 1px solid #ffffff35;
    border-radius: 18px;
    padding: 25px 20px;
    width: 220px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
    background: #ffffff30;
}

.card .icon {
    font-size: 38px;
    margin-bottom: 12px;
}

.card h3 {
    margin-bottom: 8px;
}

.card p {
    color: #e5d4ff;
    font-size: 14px;
}
