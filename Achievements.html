<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizMaster - Achievements</title>

<style>
body {
    margin: 0;
    padding: 25px 15px;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    background: linear-gradient(135deg, #18052e, #481080, #7b2cbf);
}

h1 {
    color: #ffd166;
    margin-top: 35px;
}

.container {
    max-width: 850px;
    margin: 30px auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
}

.badge {
    background: #ffffff20;
    border: 1px solid #ffffff50;
    border-radius: 18px;
    padding: 25px 15px;
}

.icon {
    font-size: 45px;
}

.locked {
    opacity: 0.45;
    filter: grayscale(1);
}

button {
    background: #ffd166;
    color: #32104f;
    border: none;
    padding: 14px 25px;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    margin: 20px;
}
</style>
</head>

<body data-theme="purple">

<h1>🎖️ Achievements & Rewards</h1>

<p>Complete challenges and collect special badges!</p>

<h2>🏆 Your Achievements</h2>

<div class="container" id="badges"></div>

<button onclick="location.href='index.html'">🏠 Home</button>

<script>

let leaderboard =
    JSON.parse(localStorage.getItem("leaderboard")) || [];

let streak =
    Number(localStorage.getItem("dailyStreak")) || 0;

let totalQuizzes = leaderboard.length;

let highestScore = leaderboard.length > 0
    ? Math.max(...leaderboard.map(p => p.score))
    : 0;

let achievements = [
    {
        icon: "🥉",
        name: "First Quiz",
        description: "Complete your first quiz.",
        unlocked: totalQuizzes >= 1
    },
    {
        icon: "🥈",
        name: "Quiz Explorer",
        description: "Complete 5 quizzes.",
        unlocked: totalQuizzes >= 5
    },
    {
        icon: "🥇",
        name: "Quiz Champion",
        description: "Get a perfect score.",
        unlocked: highestScore >= 3
    },
    {
        icon: "🔥",
        name: "Streak Starter",
        description: "Reach a 3-day streak.",
        unlocked: streak >= 3
    },
    {
        icon: "👑",
        name: "Quiz Legend",
        description: "Complete 10 quizzes.",
        unlocked: totalQuizzes >= 10
    },
    {
        icon: "🌟",
        name: "Daily Star",
        description: "Complete a daily challenge.",
        unlocked: streak >= 1
    }
];

let display = document.getElementById("badges");

achievements.forEach(item => {

    let card = document.createElement("div");

    card.className = item.unlocked ? "badge" : "badge locked";

    card.innerHTML = `
        <div class="icon">${item.icon}</div>
        <h3>${item.name}</h3>
        <p>${item.description}</p>
        <strong>${item.unlocked ? "✅ Unlocked" : "🔒 Locked"}</strong>
    `;

    display.appendChild(card);

});

</script>
<script>
const savedTheme = localStorage.getItem("selectedTheme") || "purple";
document.body.setAttribute("data-theme", savedTheme);
</script>
</body>
</html>
